<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reasons I Love You</title>
  <style>
    body { margin: 0; overflow: hidden; background: #05000a; font-family: 'Georgia', serif; }
    canvas { display: block; }

    #reason {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translate(-50%, 24px);
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      text-align: center;
      max-width: 78%;
      letter-spacing: 0.5px;
      line-height: 1.5;
      text-shadow:
        0 2px 24px rgba(0,0,0,0.95),
        0 0 60px rgba(0,0,0,0.7);
      pointer-events: none;
      transition:
        transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 1.4s ease;
      opacity: 0;
    }
    #reason.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    #hint {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      color: #ffb3d1;
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: lowercase;
      opacity: 0.7;
      animation: pulse 2.5s infinite;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }

#header {
  position: absolute;
  top: 8%;
  left: 50%;
  transform: translate(-50%, -16px);
  color: #ffffff;
  font-size: 2.6rem;
  font-weight: 400;
  font-style: italic;
  letter-spacing: 3px;
  text-align: center;
  max-width: 80%;
  line-height: 1.3;
  text-shadow:
    0 2px 30px rgba(0,0,0,0.9),
    0 0 60px rgba(255,120,180,0.35);
  pointer-events: none;
  opacity: 0;
  transition: opacity 2.5s ease, transform 2.5s ease;
  z-index: 15;
}
#header.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

    #sound-icon {
      position: absolute;
      top: 20px;
      right: 24px;
      color: #ffb3d1;
      font-size: 1rem;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      z-index: 20;
    }
    #sound-icon.on { opacity: 0.7; }

    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 35%,
        rgba(0,0,0,0.65) 100%);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="vignette"></div>
  <div id="header">Reasons why I love you</div>
  <div id="reason"></div>
  <div id="hint">click the heart</div>
  <div id="sound-icon">♪</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // 💌 EDIT THIS LIST — put your own reasons here
    const reasons = [
      "Mero babuu bhayeraa",
      "Mero sano babuu bhayeraa",
      "You think about me when I am not around",
      "You are my best friend",
      "You are a one hundred by one hundred fashion star",
      "I have the most fun when I am with you",
      "I laugh the most when I am with you",
      "We share the best moments together",
    ];

    // =========================================================
    //  ROMANTIC FILM SCORE AUDIO ENGINE  (fixed gain staging)
    // =========================================================
    const Audio = {
      ctx: null,
      master: null,
      padLevel: null,       // ramped 0 -> target on init
      padTargetGain: 0.10,  // AUDIBLE now (was 0.022)
      swellGain: 0.20,      // peak pad level during a reason
      melodyBus: null,
      melodyTargetGain: 0.50, // AUDIBLE now (was 0.04)
      reverbSend: null,
      enabled: false,
      nextMelodyTime: 0,
      melodyFreqs: [],

      init() {
        if (this.enabled) return;

        const Ctx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new Ctx();

        // Browsers may create the context suspended — resume it.
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        const t0 = this.ctx.currentTime;

        // ---------- MASTER ----------
        this.master = this.ctx.createGain();
        this.master.gain.setValueAtTime(0.0001, t0);
        this.master.gain.linearRampToValueAtTime(1.0, t0 + 2.0);
        this.master.connect(this.ctx.destination);

        // ---------- REVERB (delay-based) ----------
        const delay = this.ctx.createDelay(1.0);
        delay.delayTime.value = 0.42;

        const dFilter = this.ctx.createBiquadFilter();
        dFilter.type = 'lowpass';
        dFilter.frequency.value = 1600;

        const dFeedback = this.ctx.createGain();
        dFeedback.gain.value = 0.45;

        const dReturn = this.ctx.createGain();
        dReturn.gain.value = 0.5;

        delay.connect(dFilter);
        dFilter.connect(dFeedback);
        dFeedback.connect(delay);
        dFilter.connect(dReturn);
        dReturn.connect(this.master);
        this.reverbSend = delay;

        // ---------- PAD CHAIN ----------
        // osc -> chordGain -> padFilter -> padLevel (ramped) -> breath (LFO) -> master
        this.padLevel = this.ctx.createGain();
        this.padLevel.gain.setValueAtTime(0.0001, t0);
        this.padLevel.gain.linearRampToValueAtTime(this.padTargetGain, t0 + 5.0);

        const breath = this.ctx.createGain();
        breath.gain.setValueAtTime(1.0, t0);

        const padFilter = this.ctx.createBiquadFilter();
        padFilter.type = 'lowpass';
        padFilter.frequency.value = 850;
        padFilter.Q.value = 0.6;

        padFilter.connect(this.padLevel);
        this.padLevel.connect(breath);
        breath.connect(this.master);

        // Warm Cmaj9 chord: C3, E3, G3, B3, D4
        const chordFreqs = [130.81, 164.81, 196.00, 246.94, 293.66];
        const chordGains = [0.35,   0.28,   0.22,   0.14,   0.10];

        chordFreqs.forEach((freq, i) => {
          [-5, 5].forEach(detune => {
            const osc = this.ctx.createOscillator();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            osc.detune.value = detune;

            const g = this.ctx.createGain();
            g.gain.value = chordGains[i] * 0.5;

            osc.connect(g);
            g.connect(padFilter);
            osc.start();
          });
        });

        // Breathing LFO — applied ONLY to breath gain (isolated from padLevel ramp)
        const lfo = this.ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.06; // ~16s cycle

        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 0.12; // ±12% around 1.0

        lfo.connect(lfoGain);
        lfoGain.connect(breath.gain);
        lfo.start();

        // ---------- MELODY BUS ----------
        this.melodyBus = this.ctx.createGain();
        this.melodyBus.gain.setValueAtTime(0.0001, t0);
        this.melodyBus.gain.linearRampToValueAtTime(this.melodyTargetGain, t0 + 3.0);
        this.melodyBus.connect(this.master);
        this.melodyBus.connect(this.reverbSend);

        this.melodyFreqs = [523.25, 659.25, 783.99, 987.77, 1174.66]; // C5 E5 G5 B5 D6
        this.nextMelodyTime = t0 + 3.0;

        // ---------- ENABLE ----------
        this.enabled = true;
        document.getElementById('sound-icon').classList.add('on');

        // ---------- WELCOME NOTE ----------
        // Soft C4 to confirm audio is on
        this.pianoNote(261.63, t0 + 0.15, 0.10);
      },

      // Piano-like note with soft attack and long decay
      pianoNote(freq, when, amp = 0.10) {
        if (!this.enabled) return;
        const partials = [
          { mult: 1, gain: 1.00, decay: 3.0 },
          { mult: 2, gain: 0.30, decay: 1.8 },
          { mult: 3, gain: 0.12, decay: 1.2 },
          { mult: 4, gain: 0.05, decay: 0.8 },
        ];
        partials.forEach(p => {
          const osc = this.ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = freq * p.mult;

          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(amp * p.gain, when + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, when + p.decay);

          osc.connect(g);
          g.connect(this.melodyBus);
          osc.start(when);
          osc.stop(when + p.decay + 0.1);
        });
      },

      // Schedule a gentle wandering melody phrase every ~7s
      scheduleMelody() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        if (now < this.nextMelodyTime - 0.5) return;

        // 6-note phrase — gently ascending then falling
        const phrase = [0, 2, 1, 3, 2, 1];
        phrase.forEach((idx, i) => {
          const freq = this.melodyFreqs[idx % this.melodyFreqs.length];
          const when = this.nextMelodyTime + i * 0.65;
          this.pianoNote(freq, when, 0.09 - i * 0.008);
        });

        // Next phrase after this one ends + a rest
        this.nextMelodyTime += phrase.length * 0.65 + 3.5;
      },

      // Swell the pad warmer during a reason
      swellPad(durationSeconds) {
        if (!this.enabled) return;
        const now = this.ctx.currentTime;

        this.padLevel.gain.cancelScheduledValues(now);
        this.padLevel.gain.setValueAtTime(this.padLevel.gain.value, now);
        this.padLevel.gain.linearRampToValueAtTime(this.swellGain, now + 1.2);
        this.padLevel.gain.linearRampToValueAtTime(
          this.padTargetGain, now + 1.2 + durationSeconds
        );
      },

      // Short rising swell on inhale
      inhaleSwell() {
        if (!this.enabled) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(360, now + 0.7);

        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.06, now + 0.5);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

        osc.connect(g);
        g.connect(this.master);
        g.connect(this.reverbSend);

        osc.start(now);
        osc.stop(now + 0.9);
      },

      // Arpeggio on reason reveal — C5, E5, G5, C6
      revealArpeggio() {
        if (!this.enabled) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => {
          this.pianoNote(f, now + i * 0.28, 0.13 - i * 0.01);
        });
      },
    };

    // =========================================================
    //  SCENE / CAMERA / RENDERER
    // =========================================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05000a, 0.018);

    const camera = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 0.5, 20);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // =========================================================
    //  TEXTURES
    // =========================================================
    function makeDotTexture() {
      const size = 64;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.3, 'rgba(255,180,220,0.9)');
      g.addColorStop(1, 'rgba(255,80,150,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }

    function makeGlowTexture() {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      g.addColorStop(0,   'rgba(255,255,255,1)');
      g.addColorStop(0.15,'rgba(255,230,245,0.9)');
      g.addColorStop(0.4, 'rgba(255,140,190,0.45)');
      g.addColorStop(1,   'rgba(255,80,150,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }

    // =========================================================
    //  HEART SHAPE
    // =========================================================
    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t)
              - 2 * Math.cos(3*t) - Math.cos(4*t);
      return { x: x * 0.35, y: y * 0.35 };
    }

    // =========================================================
    //  PARTICLES
    // =========================================================
    const PARTICLE_COUNT = 2800;
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const targetPos = new Float32Array(PARTICLE_COUNT * 3);
    const chaosPos  = new Float32Array(PARTICLE_COUNT * 3);
    const colors    = new Float32Array(PARTICLE_COUNT * 3);
    const progress  = new Float32Array(PARTICLE_COUNT);

    const colorA = new THREE.Color(0xff2b6b);
    const colorB = new THREE.Color(0xffc0d8);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = heartPoint(t);
      const fill = Math.pow(Math.random(), 0.55);
      const hx = p.x * fill + (Math.random() - 0.5) * 0.6;
      const hy = p.y * fill + (Math.random() - 0.5) * 0.6;
      const hz = (Math.random() - 0.5) * 2.5;

      targetPos[i*3]     = hx;
      targetPos[i*3 + 1] = hy;
      targetPos[i*3 + 2] = hz;

      const r = 40 + Math.random() * 40;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      chaosPos[i*3]     = r * Math.sin(phi) * Math.cos(theta);
      chaosPos[i*3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      chaosPos[i*3 + 2] = r * Math.cos(phi);

      positions[i*3]     = chaosPos[i*3];
      positions[i*3 + 1] = chaosPos[i*3 + 1];
      positions[i*3 + 2] = chaosPos[i*3 + 2];

      const c = colorA.clone().lerp(colorB, Math.random());
      colors[i*3]     = c.r;
      colors[i*3 + 1] = c.g;
      colors[i*3 + 2] = c.b;

      progress[i] = 0;
    }

    const heartGeo = new THREE.BufferGeometry();
    heartGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const heartMat = new THREE.PointsMaterial({
      size: 0.42,
      map: makeDotTexture(),
      vertexColors: true,
      transparent: true,
      opacity: 1.0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });

    const heart = new THREE.Points(heartGeo, heartMat);
    scene.add(heart);

    const glowMat = new THREE.SpriteMaterial({
      map: makeGlowTexture(),
      color: 0xffffff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const glowSprite = new THREE.Sprite(glowMat);
    glowSprite.scale.set(4, 4, 1);
    scene.add(glowSprite);

    // =========================================================
    //  FLOOR + MIRROR
    // =========================================================
    const floorGeo = new THREE.PlaneGeometry(200, 200);
    const floorMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.35 } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime;
        uniform float uOpacity;
        void main() {
          float d = distance(vUv, vec2(0.5));
          float fade = smoothstep(0.5, 0.05, d);
          vec3 base = mix(vec3(0.02,0.0,0.04), vec3(0.20,0.03,0.12), fade);
          float sheen = 0.05 * sin(vUv.y * 40.0 + uTime * 0.4);
          base += vec3(sheen * 0.4, sheen * 0.1, sheen * 0.3);
          gl_FragColor = vec4(base, fade * uOpacity);
        }
      `,
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -9.5;
    scene.add(floor);

    const mirrorMat = new THREE.PointsMaterial({
      size: 0.42,
      map: makeDotTexture(),
      vertexColors: true,
      transparent: true,
      opacity: 0.20,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const heartMirror = new THREE.Points(heartGeo, mirrorMat);
    heartMirror.scale.y = -1;
    heartMirror.position.y = -19;
    scene.add(heartMirror);

    // =========================================================
    //  STARS
    // =========================================================
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(900 * 3);
    for (let i = 0; i < 900; i++) {
      starPos[i*3]     = (Math.random() - 0.5) * 140;
      starPos[i*3 + 1] = (Math.random() - 0.5) * 140;
      starPos[i*3 + 2] = (Math.random() - 0.5) * 140 - 40;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      size: 0.18, color: 0xffffff, transparent: true, opacity: 0.65,
    }));
    scene.add(stars);

    // =========================================================
    //  EMBERS
    // =========================================================
    const EMBER_COUNT = 180;
    const emberGeo = new THREE.BufferGeometry();
    const emberPos = new Float32Array(EMBER_COUNT * 3);
    const emberSpeed = new Float32Array(EMBER_COUNT);
    for (let i = 0; i < EMBER_COUNT; i++) {
      emberPos[i*3]     = (Math.random() - 0.5) * 40;
      emberPos[i*3 + 1] = -12 + Math.random() * 30;
      emberPos[i*3 + 2] = (Math.random() - 0.5) * 20 - 2;
      emberSpeed[i]     = 0.4 + Math.random() * 0.9;
    }
    emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
    const embers = new THREE.Points(emberGeo, new THREE.PointsMaterial({
      size: 0.28,
      map: makeDotTexture(),
      color: 0xffc070,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    }));
    scene.add(embers);

    // =========================================================
    //  STATE
    // =========================================================
    const reasonEl = document.getElementById('reason');
    const hintEl = document.getElementById('hint');

    let showing = false;
    let lastIndex = -1;

    let cameraTargetZ = 20;
    let cameraCurrentZ = 20;

    let worldTimeScale = 1;
    let worldTimeTarget = 1;

    let clickTimer = -1;
    let inhaleAmount = 0;
    let pulsePhase = 0;

    function pickNextReason() {
      let idx;
      do { idx = Math.floor(Math.random() * reasons.length); }
      while (idx === lastIndex && reasons.length > 1);
      lastIndex = idx;
      return reasons[idx];
    }

    function triggerReveal() {
      if (showing) return;
      showing = true;

      Audio.init();  // no-op after first call
      hintEl.style.opacity = '0';

      clickTimer = 0;
      Audio.inhaleSwell();

      setTimeout(() => {
        Audio.revealArpeggio();
        Audio.swellPad(4.2);

        cameraTargetZ = 15.5;
        worldTimeTarget = 0.15;

        reasonEl.textContent = pickNextReason();
        reasonEl.classList.add('show');
      }, 1200);

      setTimeout(() => {
        reasonEl.classList.remove('show');
      }, 4700);

      setTimeout(() => {
        cameraTargetZ = 20;
        worldTimeTarget = 1;
      }, 5300);

      setTimeout(() => {
        showing = false;
      }, 5800);
    }

    renderer.domElement.addEventListener('click', triggerReveal);
    renderer.domElement.addEventListener('touchstart', (e) => {
      e.preventDefault();
      triggerReveal();
    }, { passive: false });

    // =========================================================
    //  ANIMATION LOOP
    // =========================================================
    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);

      const rawDt = Math.min(clock.getDelta(), 0.05);

      // Schedule background melody phrases
      Audio.scheduleMelody();

      worldTimeScale += (worldTimeTarget - worldTimeScale) * Math.min(rawDt * 2.2, 1);
      const dt = rawDt * worldTimeScale;
      elapsed += dt;

      // Inhale animation
      if (clickTimer >= 0) {
        clickTimer += rawDt;
        if (clickTimer < 0.4) {
          const p = clickTimer / 0.4;
          inhaleAmount = p * p;
        } else if (clickTimer < 0.9) {
          const p = (clickTimer - 0.4) / 0.5;
          inhaleAmount = 1 - (p * p * (3 - 2 * p));
        } else {
          inhaleAmount = 0;
          clickTimer = -1;
        }
      }

      const assemblySpeed = 0.55;
      const collapseFactor = 1 - inhaleAmount * 0.97;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        if (progress[i] < 1) {
          const stagger = (i % 37) / 37 * 0.5;
          const raw = Math.max(0, Math.min(1, (elapsed - stagger) * assemblySpeed));
          progress[i] = 1 - Math.pow(1 - raw, 3);
        }

        const p = progress[i];
        const ease = p * p * (3 - 2 * p);

        let x = chaosPos[i*3]     * (1 - ease) + targetPos[i*3]     * ease;
        let y = chaosPos[i*3 + 1] * (1 - ease) + targetPos[i*3 + 1] * ease;
        let z = chaosPos[i*3 + 2] * (1 - ease) + targetPos[i*3 + 2] * ease;

        x *= collapseFactor;
        y *= collapseFactor;
        z *= collapseFactor;

        positions[i*3]     = x;
        positions[i*3 + 1] = y;
        positions[i*3 + 2] = z;
      }
      heartGeo.attributes.position.needsUpdate = true;

      const glowPeak = inhaleAmount * inhaleAmount;
      glowMat.opacity = glowPeak * 0.95;
      const gs = 4 + glowPeak * 8;
      glowSprite.scale.set(gs, gs, 1);

      pulsePhase += rawDt * 1.4;
      const beatPos = pulsePhase % (Math.PI * 2);
      const b1 = Math.exp(-Math.pow((beatPos - 0) / 0.35, 2));
      const b2 = 0.55 * Math.exp(-Math.pow((beatPos - 1.1) / 0.45, 2));
      const heartbeat = (b1 + b2) * (clickTimer < 0 ? 1 : 0);

      const sX = 1 + heartbeat * 0.038;
      const sY = 1 + heartbeat * 0.014;
      const sZ = 1 + heartbeat * 0.024;
      heart.scale.set(sX, sY, sZ);
      heartMirror.scale.set(sX, -sY, sZ);

      heartMat.opacity = 0.82 + heartbeat * 0.18;
      mirrorMat.opacity = 0.14 + heartbeat * 0.10;

      heart.rotation.y = Math.sin(elapsed * 0.35) * 0.32;
      heart.rotation.x = Math.sin(elapsed * 0.25) * 0.08;
      heartMirror.rotation.y = heart.rotation.y;
      heartMirror.rotation.x = -heart.rotation.x;

      const emberArr = emberGeo.attributes.position.array;
      for (let i = 0; i < EMBER_COUNT; i++) {
        emberArr[i*3 + 1] += emberSpeed[i] * dt * 1.2;
        emberArr[i*3]     += Math.sin(elapsed + i) * 0.002;
        if (emberArr[i*3 + 1] > 20) {
          emberArr[i*3 + 1] = -12;
          emberArr[i*3]     = (Math.random() - 0.5) * 40;
          emberArr[i*3 + 2] = (Math.random() - 0.5) * 20 - 2;
        }
      }
      emberGeo.attributes.position.needsUpdate = true;

      stars.rotation.y += dt * 0.015;

      cameraCurrentZ += (cameraTargetZ - cameraCurrentZ) * Math.min(rawDt * 1.6, 1);
      camera.position.z = cameraCurrentZ;
      camera.lookAt(0, 0, 0);

      floorMat.uniforms.uTime.value = elapsed;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
